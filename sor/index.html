Merhaba. Elimde birkaç proje var, hepsini sana anlatıp AKIL/FİKİR istiyorum.
Amacım: bu projeleri PARASIZ (kredi kartı olmadan) şekilde internette, 7/24
ayakta tutmak. Aşağıda durumu dürüstçe yazdım. Sonundaki soruları cevapla.

== KİM ==
Adım Enes. Çok param yok, kredi kartım yok. Kendi uygulamam "Çukur"u yayına
sokmak istiyorum ama sunucu pahalı diye çıkamadım. Bu yüzden ücretsiz altyapı
arıyorum.

== PROJELER VE DURUM ==

1) DIŞ BEYİN (bilgi motoru)
   - Tek bir HTML sayfası. İçine ~70.000 Vikipedi satırı gömülü (gzip+base64).
   - Tarayıcıda BM25 arama + kural tabanlı cevap çıkarma. Sunucu YOK.
   - Parolayla kilitli (AES-GCM). CANLI:
     https://enestaspatlatan6-ui.github.io
   - Durum: ÇALIŞIYOR, bedava, GitHub Pages'te kalıcı.

2) YANKI (sesli oda + jetonlu slot)
   - Sesli odalar: MQTT (broker.emqx.io, hesapsız) + WebRTC ses.
   - Slot makinesi: sanal jeton (gerçek paraya çevrilmez, kumar değil).
   - CANLI: https://enestaspatlatan6-ui.github.io/oda
   - Durum: ÇALIŞIYOR, bedava, statik.

3) KEHANET (tarot + kahve falı + günlük burç) — Flutter Android uygulaması
   - Hesaplama tamamen cihazda, sunucu gerekmez. Reklam + uygulama içi satın
     alma eklentileri var (google_mobile_ads, in_app_purchase).
   - APK telefona kurulabilir:
     https://enestaspatlatan6-ui.github.io/indir
   - Durum: ÇALIŞIYOR. Play Store için Google Play Developer hesabı ($25 +
     kart) gerekiyor, henüz yok.

4) ÇUKUR (ASIL PROJE) — sesli sohbet + slot + sosyal, TikTok tarzı
   - Backend: Fastify + Prisma + PostgreSQL (118 migration) + LiveKit (sesli
     oda için WebRTC sunucusu) + S3/R2 (medya) + Firebase (bildirim).
   - Uygulama: Flutter (Android). Çok ağır, çok özellik.
   - Durum: KENDİ BİLGİSAYARIMDA ÇALIŞIYOR (Docker Postgres + migration +
     server + /health = ok). Aynı wifi'da telefondan erişiliyor.
   - YAYINA ÇIKAMIYOR çünkü: kalıcı sunucu lazım, ücretsiz+kartsız bir yol
     bulamadım.

== ŞU ANA KADAR DENENEN ÜCRETSİZ SUNUCU YOLLARI ==
   - GitHub Pages: sadece statik sayfa (beyin, Yankı için oldu). Backend
     çalıştıramaz.
   - cloudflared / localtunnel tüneli: PC açıkken geçici genel adres verir,
     kalıcı değil.
   - Kartsız bulut planı: Back4App Containers + Neon (Postgres) + LiveKit
     Cloud + Supabase Storage — hepsi ücretsiz katman, kart istemiyor. Ama
     her biri için ayrı HESAP açmak gerekiyor; henüz açmadım.
   - Oracle Always Free: kayıt sürekli hata veriyor.

== BİLİNEN GERÇEKLER ==
   - "Sınırsız + bedava + milyonlarca kullanıcı + hesapsız + hiçbir cihaza
